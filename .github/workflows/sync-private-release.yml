name: Sync private release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 0.3.0
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Download private release assets
        env:
          GH_TOKEN: ${{ secrets.RTT_PRIVATE_RELEASE_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir release-assets
          gh release download "v${VERSION}" \
            --repo Jensen-Yao/RTT-test \
            --dir release-assets

      - name: Verify release checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "v${VERSION}" --repo Jensen-Yao/RTT >/dev/null 2>&1; then
            gh release upload "v${VERSION}" release-assets/* \
              --repo Jensen-Yao/RTT \
              --clobber
          else
            gh release create "v${VERSION}" release-assets/* \
              --repo Jensen-Yao/RTT \
              --target main \
              --title "RTT v${VERSION}" \
              --generate-notes
          fi
